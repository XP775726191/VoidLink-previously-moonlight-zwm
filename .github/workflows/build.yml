# .github/workflows/build.yml
name: Build VoidLink IPA

on:
  push:
    branches: [ "Integration" ]      # 切回真正的开发分支
  workflow_dispatch:                 # 允许手动触发

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 CocoaPods 依赖
      - name: Install Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      # 注意：项目文件在 moonlight-common 子目录下，Scheme 名称可能是 moonlight-common 或 VoidLink
      - name: Archive Project
        run: xcodebuild -project moonlight-common/moonlight-common.xcodeproj -scheme moonlight-common -sdk iphoneos -configuration Release -archivePath VoidLink.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Create IPA from Archive
        run: |
          mkdir -p Payload
          cp -R VoidLink.xcarchive/Products/Applications/*.app Payload/
          zip -r VoidLink.ipa Payload/

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned.ipa
          path: VoidLink.ipa
