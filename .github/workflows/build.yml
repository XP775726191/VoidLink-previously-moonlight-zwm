# .github/workflows/build.yml
name: Build VoidLink IPA

on:
  push:
    branches: [ "ReadmeBranch" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键：搜索所有 .xcodeproj 和 .xcworkspace 文件
      - name: Find Xcode project files
        run: |
          echo "=== Searching for .xcodeproj ==="
          find . -name "*.xcodeproj" -type d
          echo "=== Searching for .xcworkspace ==="
          find . -name "*.xcworkspace" -type d

      # 暂时注释掉编译步骤，先观察输出
      # （等确定路径后再取消注释）
