# .github/workflows/build.yml
name: Build VoidLink IPA

on:
  push:
    branches: [ "ReadmeBranch" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      # 关键修改：启用子模块拉取
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true   # 自动初始化并更新子模块

      # 可选：显示子模块状态，便于调试
      - name: Check submodules
        run: |
          git submodule status

      # 列出可用的 Schemes（确认无误）
      - name: List available schemes
        run: |
          xcodebuild -list -project moonlight-common/moonlight-common.xcodeproj

      # 安装 CocoaPods 依赖（如果存在）
      - name: Install Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          else
            if [ -f "moonlight-common/Podfile" ]; then
              cd moonlight-common && pod install
            fi
          fi

      # 编译（Scheme 确认为 moonlight-common）
      - name: Archive Project
        run: |
          xcodebuild -project moonlight-common/moonlight-common.xcodeproj -scheme moonlight-common -sdk iphoneos -configuration Release -archivePath VoidLink.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Create IPA from Archive
        run: |
          mkdir -p Payload
          cp -R VoidLink.xcarchive/Products/Applications/*.app Payload/
          zip -r VoidLink.ipa Payload/

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned.ipa
          path: VoidLink.ipa
