# .github/workflows/build.yml
name: Build VoidLink IPA

on:
  push:
    branches: [ "ReadmeBranch" ]   # 改用到 ReadmeBranch 分支（避免 Integration 的兼容性问题）
  workflow_dispatch:               # 允许手动触发

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest          # 使用 GitHub 提供的 macOS 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 拉取代码

      # 如果项目使用 CocoaPods，自动安装依赖（可选）
      - name: Install Dependencies
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      # 核心修复：将所有参数合并为一行，避免换行解析问题
      - name: Archive Project
        run: xcodebuild -project VoidLink.xcodeproj -scheme VoidLink -sdk iphoneos -configuration Release -archivePath VoidLink.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Create IPA from Archive
        run: |
          mkdir -p Payload
          cp -R VoidLink.xcarchive/Products/Applications/VoidLink.app Payload/
          zip -r VoidLink.ipa Payload/

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned.ipa
          path: VoidLink.ipa
