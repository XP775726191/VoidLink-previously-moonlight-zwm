name: Build VoidLink IPA

on:
  push:
    branches: [ "Integration" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Archive Project
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -sdk iphoneos \
            -configuration Release \
            -archivePath VoidLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create IPA from Archive
        run: |
          mkdir -p Payload
          cp -R VoidLink.xcarchive/Products/Applications/VoidLink.app Payload/
          zip -r VoidLink.ipa Payload/

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned.ipa
          path: VoidLink.ipa
