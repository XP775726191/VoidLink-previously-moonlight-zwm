# .github/workflows/build.yml
name: Build VoidLink IPA

on:
  push:
    branches: [ "ReadmeBranch" ]      # 使用稳定分支
  workflow_dispatch:                  # 允许手动触发

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 进入 Limelight 目录安装 CocoaPods 依赖（如果存在 Podfile）
      - name: Install Dependencies
        run: |
          cd Limelight
          if [ -f "Podfile" ]; then
            pod install
          fi

      # 在 Limelight 目录下编译，指定项目文件和 scheme（假设 scheme 名为 Limelight）
      - name: Archive Project
        run: |
          cd Limelight
          xcodebuild -project Limelight.xcodeproj -scheme Limelight -sdk iphoneos -configuration Release -archivePath ../VoidLink.xcarchive CODE_SIGNING_ALLOWED=NO archive

      # 从归档中提取 .app，打包成 IPA
      - name: Create IPA from Archive
        run: |
          mkdir -p Payload
          cp -R VoidLink.xcarchive/Products/Applications/*.app Payload/
          zip -r VoidLink.ipa Payload/

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned.ipa
          path: VoidLink.ipa
